version: '3'

name: 'rip'

services:
  makemkv:
    image: jlesage/makemkv
    restart: unless-stopped
    volumes:
      - /home/Backup/data/makemkv:/config
      - /mnt/Backup/Videos/BluRay:/output
      - /home/Backup/data:/storage:ro
    devices:
      - /dev/sr0:/dev/sr0
      - /dev/sg0:/dev/sg0
    ports:
      - '5800:5800'

  handbrake:
    restart: unless-stopped
    image: jlesage/handbrake
    ports:
      - "5801:5800"
    environment:
      - AUTOMATED_CONVERSION=0
      - HANDBRAKE_GUI=1
      - DARK_MODE=1
      - TZ=America/Sao_Paulo
    volumes:
      - "/home/Backup/data/handbrake:/config:rw"
      - "/home/Backup/data:/storage:ro"
      - "/mnt/Backup/Videos/BluRay:/watch:rw"
      - "/mnt/Backup/Videos/BluRayOptimized:/output:rw"
    devices:
      - /dev/dri:/dev/dri
